apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-uoc
  spec: 
    replicas: 2
    selector:
      matchLabels:
        app: web-uoc
    template:
      metadata:
        labels:
          app: web-uoc
      spec:
        containers:
          - name: web-uoc
            image: web-uoc:BUILD_TAG_PLACEHOLDER
            imagePullPolicy: Never
            ports:
              - containerPort: 8080